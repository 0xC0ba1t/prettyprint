# Default configuration: 128px text-to-image on a free Colab T4 (16 GB, fp16).
# Anything omitted falls back to the dataclass defaults in sd/config.py.
data:
  dataset: lambdalabs/pokemon-blip-captions
  image_size: 128

vae:
  base_channels: 64
  ch_mult: [1, 2, 4, 4]

unet:
  model_channels: 128
  ch_mult: [1, 2, 2]
  num_res_blocks: 2
  context_dim: 256

text:
  vocab_size: 8192
  width: 256
  layers: 6

diffusion:
  prediction_type: v_prediction
  zero_terminal_snr: true
  beta_schedule: scaled_linear

vae_train:
  batch_size: 16
  max_steps: 8000

train:
  batch_size: 32
  max_steps: 20000
  lr: 0.0001
  ema_decay: 0.9995
  cond_drop_prob: 0.1
  min_snr_gamma: 5.0
